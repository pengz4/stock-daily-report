[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-daily-report"
version = "0.1.0"
description = "Auditable, rule-first A-share daily research reporting"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
]

[project.scripts]
stock-daily-report = "stock_daily_report.cli:main"

[project.optional-dependencies]
akshare = [
    "akshare>=1.13",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stock_daily_report.chan = ["strict_chan_rules.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
