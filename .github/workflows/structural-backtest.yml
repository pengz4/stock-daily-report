name: Structural backtest

on:
  schedule:
    - cron: "30 9 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install setuptools==80.9.0 wheel==0.45.1
          python -m pip install --no-build-isolation -r requirements.lock
          python -m pip install --no-build-isolation --no-deps .
      - name: Run deterministic fixture backtest
        run: |
          stock-daily-report backtest \
            --settings config/backtest.yaml \
            --watchlist config/watchlist.yaml \
            --fixture-directory fixtures/bars \
            --output-root .
      - name: Upload backtest report
        uses: actions/upload-artifact@v4
        with:
          name: structural-backtest-report
          path: reports/backtests
          retention-days: 30
