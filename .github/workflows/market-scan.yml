name: Isolated after-close scan

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: "Current Shanghai trading date"
        required: true
        type: string

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        scope: [market, watchlist]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install setuptools==80.9.0 wheel==0.45.1
          python -m pip install --no-build-isolation -r requirements.lock
          python -m pip install --no-build-isolation --no-deps .
      - name: Verify date and market close
        env:
          REQUESTED_DATE: ${{ inputs.report_date }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, time
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          if now.date().isoformat() != os.environ["REQUESTED_DATE"] or now.time() < time(15, 10):
              raise SystemExit("Requested date must be today and the market must be closed")
          PY
      - name: Generate fresh scan
        env:
          REPORT_DATE: ${{ inputs.report_date }}
          SCAN_SCOPE: ${{ matrix.scope }}
        run: |
          args=()
          if [ "$SCAN_SCOPE" = watchlist ]; then
            args+=(--scope watchlist --watchlist config/watchlist.yaml)
          fi
          python - market-scan \
            --date "$REPORT_DATE" \
            --settings config/market_scan.yaml \
            --data-settings config/settings.yaml \
            --output-root . \
            --resumable "${args[@]}" <<'PY'
          import sys
          import time
          from urllib.parse import urlparse

          import requests
          import stock_daily_report.cli as cli

          original_get = requests.get

          def get_with_bounded_sina_retries(url, *args, **kwargs):
              if urlparse(url).hostname != "vip.stock.finance.sina.com.cn":
                  return original_get(url, *args, **kwargs)
              kwargs.setdefault("timeout", 8)
              for attempt in range(4):
                  try:
                      return original_get(url, *args, **kwargs)
                  except requests.exceptions.RequestException:
                      if attempt == 3:
                          raise
                      time.sleep(attempt + 1)

          requests.get = get_with_bounded_sina_retries
          original_provider = cli.AkShareUniverseProvider

          def provider_with_longer_deadline(*args, **kwargs):
              kwargs["request_timeout_seconds"] = 480
              return original_provider(*args, **kwargs)

          cli.AkShareUniverseProvider = provider_with_longer_deadline
          raise SystemExit(cli.main(sys.argv[1:]))
          PY
      - name: Upload isolated scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-${{ matrix.scope }}-scan-${{ inputs.report_date }}
          path: ${{ matrix.scope == 'watchlist' && 'watchlist-scans' || 'market-scans' }}/${{ inputs.report_date }}
          if-no-files-found: warn
          retention-days: 7
