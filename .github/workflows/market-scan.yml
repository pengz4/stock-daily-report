name: Full-market A-share scan

on:
  schedule:
    - cron: "15 7 * * 1-5"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Current Shanghai date; older dates require a valid artifact"
        required: false
        type: string
  push:
    branches:
      - feature/report-wide-cn
    paths:
      - "config/market_scan.yaml"
      - "config/watchlist.yaml"

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  watchlist-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: stock-daily-report-history
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install setuptools==80.9.0 wheel==0.45.1
          python -m pip install --no-build-isolation -r requirements.lock
          python -m pip install --no-build-isolation --no-deps .
      - name: Select report date
        id: report-date
        env:
          REQUESTED_DATE: ${{ inputs.report_date }}
        run: |
          if [ -n "$REQUESTED_DATE" ]; then
            report_date="$REQUESTED_DATE"
          else
            report_date="$(date +%F)"
          fi
          canonical_date="$(python - "$report_date" <<'PY'
          import sys
          from datetime import date
          print(date.fromisoformat(sys.argv[1]).isoformat())
          PY
          )"
          echo "report_date=$canonical_date" >> "$GITHUB_OUTPUT"
      - name: Generate watchlist scan
        run: |
          report_date="${{ steps.report-date.outputs.report_date }}"
          python -m stock_daily_report.cli market-scan \
            --date "$report_date" \
            --settings config/market_scan.yaml \
            --data-settings config/settings.yaml \
            --output-root . \
            --scope watchlist \
            --watchlist config/watchlist.yaml
      - name: Persist watchlist scan history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .report-history
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          if [ ! -e .report-history/.git ]; then
            git -C .report-history init
            git -C .report-history remote add origin \
              "https://github.com/${GITHUB_REPOSITORY}.git"
          fi
          git -C .report-history config user.name "github-actions[bot]"
          git -C .report-history config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .report-history -c \
            http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            pull --rebase --autostash origin reports-history \
            || git -C .report-history -c \
              http.extraheader="AUTHORIZATION: basic ${auth_header}" \
              fetch origin reports-history
          git -C .report-history reset --hard origin/reports-history 2>/dev/null || true
          mkdir -p .report-history/watchlist-scans
          if [ -d watchlist-scans ]; then
            cp -a watchlist-scans/. .report-history/watchlist-scans/
          fi
          find .report-history/watchlist-scans -name '*.lock' -delete 2>/dev/null || true
          git -C .report-history add watchlist-scans
          if ! git -C .report-history diff --cached --quiet; then
            git -C .report-history commit -m "chore: publish watchlist scan history"
            push_succeeded=false
            for attempt in 1 2 3; do
              if git -C .report-history -c \
                http.extraheader="AUTHORIZATION: basic ${auth_header}" \
                push origin HEAD:refs/heads/reports-history; then
                push_succeeded=true
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                git -C .report-history -c \
                  http.extraheader="AUTHORIZATION: basic ${auth_header}" \
                  pull --rebase --autostash origin reports-history
              fi
            done
            if [ "$push_succeeded" != true ]; then
              echo "Failed to publish watchlist scan history after 3 attempts" >&2
              exit 1
            fi
          fi

  market-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: stock-daily-report-history
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Restore report history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: reports-history
          path: .report-history
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install setuptools==80.9.0 wheel==0.45.1
          python -m pip install --no-build-isolation -r requirements.lock
          python -m pip install --no-build-isolation --no-deps .
      - name: Select report date
        id: report-date
        env:
          REQUESTED_DATE: ${{ inputs.report_date }}
        run: |
          if [ -n "$REQUESTED_DATE" ]; then
            report_date="$REQUESTED_DATE"
          else
            report_date="$(date +%F)"
          fi
          canonical_date="$(python - "$report_date" <<'PY'
          import sys
          from datetime import date
          print(date.fromisoformat(sys.argv[1]).isoformat())
          PY
          )"
          echo "report_date=$canonical_date" >> "$GITHUB_OUTPUT"
      - name: Merge previous market scan history
        run: |
          if [ -d .report-history/market-scans ]; then
            cp -a .report-history/market-scans ./market-scans
          fi
      - name: Generate market scan
        run: |
          report_date="${{ steps.report-date.outputs.report_date }}"
          python -m stock_daily_report.cli market-scan \
            --date "$report_date" \
            --settings config/market_scan.yaml \
            --data-settings config/settings.yaml \
            --output-root . \
            --resumable
      - name: Persist market scan history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          if [ ! -e .report-history/.git ]; then
            mkdir -p .report-history
            git -C .report-history init
            git -C .report-history remote add origin \
              "https://github.com/${GITHUB_REPOSITORY}.git"
          fi
          rm -rf .report-history/market-scans
          cp -a market-scans .report-history/market-scans
          find .report-history/market-scans -name '*.lock' -delete
          git -C .report-history config user.name "github-actions[bot]"
          git -C .report-history config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .report-history add market-scans
          if ! git -C .report-history diff --cached --quiet; then
            git -C .report-history commit -m "chore: publish market scan history"
            push_succeeded=false
            for attempt in 1 2 3; do
              if git -C .report-history -c \
                http.extraheader="AUTHORIZATION: basic ${auth_header}" \
                push origin HEAD:refs/heads/reports-history; then
                push_succeeded=true
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                git -C .report-history -c \
                  http.extraheader="AUTHORIZATION: basic ${auth_header}" \
                  pull --rebase --autostash origin reports-history
              fi
            done
            if [ "$push_succeeded" != true ]; then
              echo "Failed to publish market scan history after 3 attempts" >&2
              exit 1
            fi
          fi
      - name: Upload market scan artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-scan-${{ steps.report-date.outputs.report_date }}
          path: market-scans/${{ steps.report-date.outputs.report_date }}
          retention-days: 30
          overwrite: true
