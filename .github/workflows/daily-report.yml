name: Daily A-share report

on:
  schedule:
    - cron: "30 8 * * 1-5"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Trading date to report (YYYY-MM-DD); blank means today"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-daily-report-pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      report_date: ${{ steps.report-date.outputs.report_date }}
    env:
      TZ: Asia/Shanghai
      REPORT_BASE_URL: ${{ vars.REPORT_BASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Restore report history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: reports-history
          path: .report-history
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install --no-build-isolation -r requirements.lock && python -m pip install --no-build-isolation --no-deps .
      - name: Select report date
        id: report-date
        env:
          REQUESTED_DATE: ${{ inputs.report_date }}
        run: |
          if [ -n "$REQUESTED_DATE" ]; then
            report_date="$REQUESTED_DATE"
          else
            report_date="$(date +%F)"
          fi
          canonical_date="$(python - "$report_date" <<'PY'
          import sys
          from datetime import date
          print(date.fromisoformat(sys.argv[1]).isoformat())
          PY
          )"
          echo "report_date=$canonical_date" >> "$GITHUB_OUTPUT"
      - name: Merge previous report history
        run: |
          if [ -d .report-history/reports ]; then
            cp -a .report-history/reports ./reports
          fi
      - name: Generate report artifacts
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          python -m stock_daily_report.cli daily \
            --date "${{ steps.report-date.outputs.report_date }}" \
            --output-root . \
            --skip-notifications
      - name: Persist report history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -d .report-history/.git ]; then
            mkdir -p .report-history
            git -C .report-history init
            git -C .report-history remote add origin \
              "https://github.com/${GITHUB_REPOSITORY}.git"
          fi
          rm -rf .report-history/reports .report-history/site
          cp -a reports .report-history/reports
          cp -a site .report-history/site
          git -C .report-history config user.name "github-actions[bot]"
          git -C .report-history config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .report-history add reports site
          if ! git -C .report-history diff --cached --quiet; then
            git -C .report-history commit -m "chore: publish report history"
            git -C .report-history -c \
              http.extraheader="AUTHORIZATION: bearer ${GITHUB_TOKEN}" \
              push origin HEAD:refs/heads/reports-history
          fi
      - name: Stage Pages artifact
        run: python scripts/publish_site.py --root . --output public
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Upload report data for notification
        uses: actions/upload-artifact@v4
        with:
          name: report-data
          path: public/reports
          retention-days: 1

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: [generate, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      REPORT_BASE_URL: ${{ vars.REPORT_BASE_URL }}
      WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install --no-build-isolation -r requirements.lock && python -m pip install --no-build-isolation --no-deps .
      - name: Download deployed report artifact
        uses: actions/download-artifact@v4
        with:
          name: report-data
          path: public/reports
      - name: Send notifications
        run: |
          python -m stock_daily_report.cli notify \
            --report "public/reports/${{ needs.generate.outputs.report_date }}/report.json" \
            --settings config/settings.yaml \
            --report-url "${REPORT_BASE_URL}/reports/${{ needs.generate.outputs.report_date }}/"
