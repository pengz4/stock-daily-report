rule_version:
  name: simplified
  version: v1
notifications:
  enabled_channels: [feishu]
  timeout_seconds: 10
  max_attempts: 3
market_data:
  primary_provider: akshare
  fallback_provider: sina
  # Local ignored cache. TTL is in seconds; weekday staleness omits holidays.
  cache_directory: .cache/stock-daily-report
  cache_ttl_seconds: 3600
  minimum_history_bars: 60
  max_completed_trading_day_lag: 1
risk_rules:
  rule_version: risk-v1
  high_realized_volatility20: 0.45
  overextension_ma20_distance: 0.20
  large_drawdown60: -0.20
  adverse_volume_ratio20: 0.50
  minimum_history_bars: 61
